[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bichig"
version = "0.0.1"
description = "From-scratch Mongolian language and script AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.scripts]
bichig-train = "bichig.train:main"
bichig-infer = "bichig.infer:main"
bichig-eval = "bichig.evaluate:main"
bichig-validate-data = "bichig.validate_data:main"
bichig-prepare-data = "bichig.prepare_data:main"
bichig-smoke = "bichig.smoke:main"
bichig-curate = "bichig.curate:main"
bichig-import-jsonl = "bichig.import_jsonl:main"
bichig-base-train = "bichig.base_train:main"
bichig-base-generate = "bichig.base_generate:main"
bichig-base-smoke = "bichig.base_smoke:main"
bichig-base-corpus = "bichig.base_corpus:main"
bichig-base-wiki = "bichig.base_wiki:main"
bichig-base-import = "bichig.base_import:main"
bichig-base-manifest = "bichig.base_manifest:main"
bichig-base-tugstugi-news = "bichig.base_tugstugi_news:main"
bichig-base-treebank = "bichig.base_treebank:main"
bichig-base-eval = "bichig.base_eval:main"
bichig-base-benchmark = "bichig.base_benchmark:main"
bichig-base-run = "bichig.base_run:main"
bichig-base-tokenizer-stats = "bichig.base_tokenizer_stats:main"

[tool.setuptools.packages.find]
include = ["bichig*"]
