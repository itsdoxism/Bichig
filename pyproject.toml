[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bichig"
version = "0.0.1"
description = "From-scratch neural Cyrillic to Traditional Mongolian script conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.scripts]
bichig-train = "bichig.train:main"
bichig-infer = "bichig.infer:main"

[tool.setuptools.packages.find]
include = ["bichig*"]
